<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listas del Taller · IES Albero</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--gold:#d4af37;--must:#dfb14b;--brown:#7a5230;--dark:#3e2713;--bg:#faf6ec;--line:#e6d9b8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#2b2118}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
header{background:#fff;border-bottom:3px solid var(--must);display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .t{flex:1;min-width:150px;line-height:1.2}header b{color:var(--dark)}header small{color:#7b6a55}
nav{display:flex;gap:6px}
.b{border:0;border-radius:10px;padding:9px 14px;background:var(--brown);color:#fff;font-weight:600;cursor:pointer}
.b.s{background:#f3e8cc;color:var(--dark)}.b.r{background:#fbe4e1;color:#a3281b}.b:disabled{opacity:.5}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;color:var(--dark)}
label{display:block;font-size:13px;font-weight:600;color:#6b5a45;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1.5px solid #d8cdb2;border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}
.item:hover{background:#fdf8ea}.item small{color:#7b6a55}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
td.c,th.c{text-align:center;width:90px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--brown)}
canvas{width:100%;height:130px;border:1.5px dashed #bfae85;border-radius:10px;background:#fff;touch-action:none}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#login{position:fixed;inset:0;background:rgba(62,39,19,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#login .card{max-width:340px;width:100%;text-align:center}
#pin{text-align:center;font-size:28px;letter-spacing:8px}
#sync{font-size:12px;padding:3px 9px;border-radius:99px;background:#eee}
.err{color:#b3261e;font-size:13px;min-height:18px}

.sigbox{height:130px;border:1.5px dashed #bfae85;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:#7b6a55;text-align:center;padding:6px}
.sigbox img{max-width:100%;max-height:100%}
#sigmodal{position:fixed;inset:0;background:rgba(62,39,19,.92);z-index:60;display:flex;flex-direction:column;padding:12px;gap:10px}
#sigmodal .top{color:#fff}#sigmodal .top b{font-size:18px}
#sigmodal input{font-size:18px}
#sigpad{flex:1;width:100%;height:auto;min-height:0;background:#fff;border:2px solid var(--gold);border-radius:12px;touch-action:none}
#sigmodal .bar{display:flex;gap:8px}#sigmodal .bar .b{flex:1;padding:14px}
.signame{font-size:13px;color:#6b5a45;margin-top:4px;min-height:16px}
.ov{position:fixed;inset:0;background:rgba(62,39,19,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.ov .card{max-width:420px;width:100%;margin:0;max-height:92vh;overflow:auto}
.ov .bar{display:flex;gap:8px;margin-top:16px}.ov .bar .b{flex:1;padding:12px}
.tb{display:flex;gap:8px;flex-wrap:wrap;padding:10px}
.ck{display:flex;align-items:center;gap:8px;font-weight:500;margin:8px 0;color:#2b2118;font-size:15px}
input[type=radio]{width:22px;height:22px;accent-color:var(--brown)}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
#who{font-size:13px;color:#6b5a45}
</style>
</head>
<body>

<div id="login"><div class="card">
  <img id="logo0" alt="Logo" width="72" height="72" style="object-fit:contain">
  <h2 style="margin-top:8px">Taller de Tecnología</h2>
  <p style="margin:0 0 14px;color:#7b6a55">I.E.S. Albero</p>
  <input id="lg-u" placeholder="Usuario" autocomplete="username" autocapitalize="off" style="margin-bottom:8px">
  <input id="lg-p" type="password" placeholder="Contraseña" autocomplete="current-password">
  <p class="err" id="pinerr"></p>
  <button class="b" style="width:100%" onclick="entrar()">Entrar</button>
  <p id="dbst" style="font-size:12px;color:#7b6a55;margin:12px 0 0">Versión 3 · conectando…</p>
</div></div>

<div id="app" class="hide">
<header>
  <img id="logo1" alt="Logo" width="40" height="40" style="object-fit:contain">
  <div class="t"><b>I.E.S. Albero</b><br><small>Taller de Tecnología</small></div>
  <span id="sync">…</span>
  <nav><span id="who"></span>
    <button class="b s" onclick="go('home')">Inicio</button>
    <button class="b s" onclick="salir()">Salir</button>
  </nav>
</header>
<main>
  <div id="tb-l" class="card tb hide"><button class="b" onclick="go('create')">Nueva lista</button><button class="b s" onclick="go('lists')">Guardadas</button><button class="b s" onclick="openSettings()">Ajustes</button></div>
  <div id="tb-e" class="card tb hide"><button class="b" onclick="go('e-fill')">Hacer encuesta</button><button id="e-b-resp" class="b s" onclick="go('e-resp')">Respuestas</button><button id="e-b-edit" class="b s" onclick="go('e-edit')">Preguntas</button></div>
  <section id="v-home"><div class="card"><h2>Hola, <span id="h-name"></span></h2><div id="home-cards"></div></div></section>
  <section id="v-lists" class="hide">
    <div class="card"><h2>Listas guardadas</h2><div id="lists"></div></div>
  </section>

  <section id="v-create" class="hide"><div class="card">
    <h2>Nueva lista</h2>
    <div class="row">
      <div><label>Etapa</label><select id="c-etapa" onchange="fillLetters()"><option value="ESO">ESO</option><option value="Bachillerato">Bachillerato</option></select></div>
      <div><label>Nivel</label><select id="c-nivel"></select></div>
      <div><label>Grupo</label><select id="c-letra"></select></div>
    </div>
    <label>Concepto</label><input id="c-concepto" placeholder="Ej: Venta de llaveros de Navidad">
    <label>Alumnos (uno por línea: Apellidos, Nombre)</label>
    <textarea id="c-alumnos" rows="8" placeholder="García Pérez, Alejandro&#10;López Gómez, Sofía"></textarea>
    <button class="b" style="width:100%;margin-top:14px" id="btn-crear" onclick="crear()">Crear lista</button>
  </div></section>

  <section id="v-detail" class="hide">
    <div class="card" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <button class="b s" onclick="go('lists')">Volver</button>
      <span style="display:flex;gap:8px"><button class="b" onclick="descargar()">Descargar PDF</button><button class="b r" onclick="borrar()">Eliminar</button></span>
    </div>
    <div class="card">
      <h2 id="d-title"></h2><p id="d-sub" style="margin:0 0 12px;color:#7b6a55"></p>
      <table><thead><tr><th>Nº</th><th>Alumno</th><th class="c">Fabricado</th><th class="c">Entregado</th></tr></thead><tbody id="d-rows"></tbody></table>
    </div>
    <div class="card"><h2 style="font-size:17px">Firmas</h2>
      <div class="sig">
        <div><label>Responsable de reparto</label><div class="sigbox" id="b1" onclick="abrirFirma(1)">Toca para firmar</div><div class="signame" id="n1"></div></div>
        <div><label>Profesor</label><div class="sigbox" id="b2" onclick="abrirFirma(2)">Toca para firmar</div><div class="signame" id="n2"></div></div>
      </div>
    </div>
  </section>

  
<section id="v-e-fill" class="hide"><div id="e-fill-body"></div></section>
  <section id="v-e-resp" class="hide"><div id="e-resp-body"></div></section>
  <section id="v-e-edit" class="hide"><div id="e-edit-body"></div></section>
  <section id="v-admin" class="hide"><div id="admin-body"></div></section>
</main>
</div>

<div id="sigmodal" class="hide">
  <div class="top"><b id="sigtitle">Firma</b></div>
  <input id="signame" placeholder="Nombre y apellidos" autocomplete="off">
  <canvas id="sigpad"></canvas>
  <div class="bar">
    <button class="b s" onclick="sigClear()">Borrar</button>
    <button class="b s" onclick="cerrarFirma()">Cancelar</button>
    <button class="b" onclick="guardarFirma()">Guardar firma</button>
  </div>
</div>
<div id="dlg" class="ov hide"><div class="card">
  <h2 id="dlg-t"></h2><p id="dlg-m" style="margin:0;color:#6b5a45"></p>
  <input id="dlg-i" class="hide" style="margin-top:12px;font-size:18px" autocomplete="off">
  <div class="bar"><button class="b s" id="dlg-cancel">Cancelar</button><button class="b" id="dlg-ok">Aceptar</button></div>
</div></div>
<div id="setmodal" class="ov hide"><div class="card">
  <h2>Ajustes</h2>
  <label>Curso escolar</label><input id="a-year">
  <label>Grupos de ESO (separados por comas)</label><input id="a-eso">
  <label>Grupos de Bachillerato (separados por comas)</label><input id="a-bach">
  <label>Logo del instituto</label>
  <div style="display:flex;align-items:center;gap:10px"><img id="a-logoprev" alt="" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff"><div style="flex:1"><input id="a-logofile" type="file" accept="image/*" onchange="subirLogo(this)"><button class="b s" style="margin-top:6px;padding:6px 10px" type="button" onclick="logoOriginal()">Usar el original</button></div></div>
  <div class="bar"><button class="b s" onclick="cerrarAjustes()">Cancelar</button><button class="b" onclick="guardarAjustes()">Guardar</button></div>
</div></div>
<div id="usermodal" class="ov hide"><div class="card">
  <h2>Usuario</h2>
  <label>Nombre</label><input id="u-nombre">
  <label>Usuario (para entrar)</label><input id="u-user" autocapitalize="off">
  <label>Contraseña</label><input id="u-pass">
  <label class="ck"><input type="checkbox" id="u-activo"> Usuario habilitado</label>
  <label class="ck" id="u-adminrow"><input type="checkbox" id="u-admin"> Administrador (todos los permisos)</label>
  <label>Permisos</label><div id="u-perms"></div>
  <div class="bar"><button class="b s" onclick="$('usermodal').classList.add('hide')">Cancelar</button><button class="b r" id="u-del" onclick="borrarUser()">Eliminar</button><button class="b" onclick="guardarUser()">Guardar</button></div>
</div></div>
<div id="qmodal" class="ov hide"><div class="card">
  <h2>Pregunta</h2>
  <label>Texto de la pregunta</label><input id="q-texto">
  <label>Tipo</label><select id="q-tipo" onchange="qTipo()"></select>
  <div id="q-opcrow"><label>Opciones (una por línea)</label><textarea id="q-opc" rows="4"></textarea></div>
  <label class="ck"><input type="checkbox" id="q-oblig"> Obligatoria</label>
  <div class="bar"><button class="b s" onclick="$('qmodal').classList.add('hide')">Cancelar</button><button class="b r" id="q-del" onclick="borrarPreg()">Eliminar</button><button class="b" onclick="guardarPreg()">Guardar</button></div>
</div></div>

let LOGO_SRC=LOGO_DEFAULT;
const LOGO_FALLBACK='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="400" height="400">${LOGO}</svg>`);
['logo0','logo1'].forEach(i=>{const im=document.getElementById(i);im.onerror=()=>{im.onerror=null;im.src=LOGO_FALLBACK};im.src=LOGO_SRC});
function aplicarLogo(){['logo0','logo1'].forEach(i=>$(i).src=LOGO_SRC)}
const $=id=>document.getElementById(id);
const DEF={year:'2026-2027',eso:'A,B,C,D,E,F',bach:'A,B',logo:''};
let cfg={...DEF}, lists=[], cur=null, adminOk=false, me=null, users=[], dbErr='';

/* ---------- Almacén: Firebase o local ---------- */
const store=(()=>{
  const online=!!FIREBASE_CONFIG.apiKey;
  const setDot=(o,p,v)=>{const k=p.split('.');let t=o;k.slice(0,-1).forEach(x=>t=t[x]=t[x]||{});t[k.pop()]=v};
  if(online){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore();
    db.settings({experimentalAutoDetectLongPolling:true,merge:true});
    return{online,
      subLists(cb){db.collection('listas').orderBy('creado','desc').onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),()=>$('sync').textContent='Sin conexión')},
      subCfg(cb){db.collection('config').doc('ajustes').onSnapshot(d=>cb(d.data()||{}))},
      add:l=>db.collection('listas').add(l),
      upd:(id,p)=>db.collection('listas').doc(id).update(p),
      del:id=>db.collection('listas').doc(id).delete(),
      setCfg:c=>db.collection('config').doc('ajustes').set(c)};
  }
  const rd=k=>JSON.parse(localStorage.getItem(k)||'null');
  let L=rd('albero_listas')||[], cbL=()=>{}, cbC=()=>{};
  const save=()=>{localStorage.setItem('albero_listas',JSON.stringify(L));cbL(L.slice())};
  return{online,
    subLists(cb){cbL=cb;cb(L.slice())},
    subCfg(cb){cbC=cb;cb(rd('albero_cfg')||{})},
    async add(l){l.id='l'+Date.now();L.unshift(l);save()},
    async upd(id,p){const l=L.find(x=>x.id===id);for(const k in p)setDot(l,k,p[k]);save()},
    async del(id){L=L.filter(x=>x.id!==id);save()},
    async setCfg(c){localStorage.setItem('albero_cfg',JSON.stringify(c));cbC(c)}};
})();
$('sync').textContent=store.online?'Sincronizado':'Solo local';
$('sync').style.background=store.online?'#d9f2dc':'#fde7c4';

/* ---------- Acceso ---------- */
function entrar(){
  const u=$('lg-u').value.trim().toLowerCase(),p=$('lg-p').value,e=$('pinerr');
  if(!users.length){e.textContent=dbErr?'Error con la base de datos: '+dbErr:'Conectando… inténtalo de nuevo en unos segundos';return}
  const x=users.find(y=>y.id===u||(y.usuario||'').toLowerCase()===u);
  if(!x||x.pass!==p){e.textContent='Usuario o contraseña incorrectos';return}
  if(x.activo===false){e.textContent='Usuario deshabilitado';return}
  sessionStorage.setItem('albero_sess',x.id);abrirSesion(x);
}
function abrirSesion(u){me=u;$('pinerr').textContent='';$('lg-p').value='';$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=u.nombre||u.usuario;go('home')}
function salir(){me=null;sessionStorage.removeItem('albero_sess');$('app').classList.add('hide');$('login').classList.remove('hide')}
['lg-u','lg-p'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')entrar()}));
function dlg({title,msg='',input=null,ok='Aceptar',cancel=null}){
  return new Promise(res=>{
    $('dlg-t').textContent=title;$('dlg-m').textContent=msg;
    const i=$('dlg-i'),bo=$('dlg-ok'),bc=$('dlg-cancel');
    i.classList.toggle('hide',!input);i.value='';
    if(input){i.type=input.type||'text';i.placeholder=input.placeholder||''}
    bo.textContent=ok;bc.classList.toggle('hide',!cancel);if(cancel)bc.textContent=cancel;
    $('dlg').classList.remove('hide');
    if(input)setTimeout(()=>i.focus(),50);
    const done=v=>{$('dlg').classList.add('hide');bo.onclick=bc.onclick=i.onkeydown=null;res(v)};
    bo.onclick=()=>done(input?i.value:true);
    bc.onclick=()=>done(input?null:false);
    i.onkeydown=e=>{if(e.key==='Enter')bo.click()};
  });
}
async function pedirAdmin(){
  for(;;){
    const c=await dlg({title:'Código de administrador',msg:'Introduce el código para continuar.',input:{type:'password',placeholder:'Código'},ok:'Entrar',cancel:'Cancelar'});
    if(c===null)return false;
    if(c===ADMIN_CODE)return true;
    await dlg({title:'Código incorrecto',msg:'Inténtalo de nuevo.'});
  }
}

/* ---------- Navegación ---------- */
const VIEWS=['home','lists','create','detail','e-fill','e-resp','e-edit','admin'];
function go(v){
  VIEWS.forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));
  $('tb-l').classList.toggle('hide',!['lists','create','detail'].includes(v));
  $('tb-e').classList.toggle('hide',!v.startsWith('e-'));
  if(v==='create')fillLetters();
  if(v.startsWith('e-')){$('e-b-resp').classList.toggle('hide',!can('ver_respuestas'));$('e-b-edit').classList.toggle('hide',!can('editar_preguntas'))}
  if(v==='home')pintarHome();if(v==='admin')pintarAdmin();if(v==='e-fill')pintarForm();if(v==='e-resp')pintarResp();if(v==='e-edit')pintarPreg();
}
let logoNuevo='';
function subirLogo(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    logoNuevo=c.toDataURL('image/png');$('a-logoprev').src=logoNuevo};im.src=r.result};
  r.readAsDataURL(f);
}
function logoOriginal(){logoNuevo='';$('a-logoprev').src=LOGO_DEFAULT;$('a-logofile').value=''}
async function openSettings(){
  if(!can('ajustes_listados')&&!await pedirAdmin())return;
  $('a-year').value=cfg.year;$('a-eso').value=cfg.eso;$('a-bach').value=cfg.bach;
  logoNuevo=cfg.logo||'';$('a-logoprev').src=logoNuevo||LOGO_DEFAULT;$('a-logofile').value='';
  $('setmodal').classList.remove('hide');
}
function cerrarAjustes(){$('setmodal').classList.add('hide')}
async function guardarAjustes(){
  const n={...cfg,year:$('a-year').value.trim()||DEF.year,eso:$('a-eso').value.trim()||DEF.eso,bach:$('a-bach').value.trim()||DEF.bach,logo:logoNuevo};

}
store.subCfg(c=>{cfg={...DEF,...c};LOGO_SRC=cfg.logo||LOGO_DEFAULT;aplicarLogo();if(me)refrescar()});

/* ---------- Crear ---------- */
function fillLetters(){
  const bach=$('c-etapa').value==='Bachillerato';
  $('c-nivel').innerHTML=(bach?['1º','2º']:['1º','2º','3º','4º']).map(x=>`<option>${x}</option>`).join('');
  $('c-letra').innerHTML=(bach?cfg.bach:cfg.eso).split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<option>${x}</option>`).join('');
}
const PART=new Set(['de','del','la','las','los','y','e','van','von','da','di']);
const tc=t=>t.toLowerCase().split(/\s+/).map((w,i)=>i&&PART.has(w)?w:w.split('-').map(z=>z.charAt(0).toUpperCase()+z.slice(1)).join('-')).join(' ');
function normNombres(t){
  return t.split('\n').map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean).map(x=>{
    const k=x.indexOf(',');
    return k<0?tc(x):tc(x.slice(0,k).trim())+', '+tc(x.slice(k+1).trim());
  }).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
}
let creando=false;
async function crear(){
  if(creando)return;
  const names=normNombres($('c-alumnos').value);
  const concepto=$('c-concepto').value.trim();
  if(!concepto||!names.length){await dlg({title:'Faltan datos',msg:'Escribe el concepto y al menos un alumno.'});return}
  creando=true;$('btn-crear').disabled=true;
  const est={};names.forEach((_,i)=>est[i]={f:false,e:false});
  const data={etapa:$('c-etapa').value,nivel:$('c-nivel').value,letra:$('c-letra').value,concepto,alumnos:names,est,
    year:cfg.year,fecha:new Date().toLocaleDateString('es-ES'),firma1:'',firma2:'',creado:Date.now()};
  $('c-concepto').value='';$('c-alumnos').value='';
  go('lists');
  store.add(data).catch(console.error);
  setTimeout(()=>{creando=false;$('btn-crear').disabled=false},1500);
}

let sigN=0, sigDrawn=false;
const pad=$('sigpad'), px=pad.getContext('2d');
const ROLES={1:'Responsable de reparto',2:'Profesor'};
function padFit(){
  const r=pad.getBoundingClientRect(), d=window.devicePixelRatio||1;
  pad.width=Math.round(r.width*d);pad.height=Math.round(r.height*d);
  px.setTransform(d,0,0,d,0,0);px.lineWidth=3;px.lineCap='round';px.lineJoin='round';px.strokeStyle='#1d1409';
}
function abrirFirma(n){
  sigN=n;sigDrawn=false;
  const l=lists.find(x=>x.id===cur);
  $('sigtitle').textContent='Firma: '+ROLES[n];
  $('signame').value=(l&&l['nombre'+n])||'';
  $('sigmodal').classList.remove('hide');
  requestAnimationFrame(()=>{padFit();const u=l&&l['firma'+n];
    if(u){const im=new Image();im.onload=()=>{const r=pad.getBoundingClientRect();px.drawImage(im,0,0,r.width,r.height);sigDrawn=true};im.src=u}});
}
function cerrarFirma(){$('sigmodal').classList.add('hide')}
function sigClear(){padFit();sigDrawn=false}
async function guardarFirma(){
  const nombre=$('signame').value.trim();
  if(!nombre){await dlg({title:'Falta el nombre',msg:'Escribe el nombre y apellidos de quien firma.'});$('signame').focus();return}
  if(!sigDrawn){await dlg({title:'Falta la firma',msg:'Dibuja la firma con el dedo.'});return}
  store.upd(cur,{['firma'+sigN]:pad.toDataURL('image/png'),['nombre'+sigN]:nombre});
  cerrarFirma();
}
(()=>{
  let d=false;
  const pos=e=>{const r=pad.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();d=true;sigDrawn=true;px.beginPath();const p=pos(e);px.moveTo(...p);px.lineTo(p[0]+0.1,p[1]+0.1);px.stroke();pad.setPointerCapture(e.pointerId)});
  pad.addEventListener('pointermove',e=>{if(d){e.preventDefault();px.lineTo(...pos(e));px.stroke()}});
  ['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t,()=>{d=false}));
})();
function pintarFirmas(l){
  [1,2].forEach(n=>{
    const u=l['firma'+n];
    $('b'+n).innerHTML=u?`<img src="${u}" alt="Firma">`:'Toca para firmar';
    $('n'+n).textContent=l['nombre'+n]||'';
  });
}

const gs=(()=>{
  if(store.online){const db=firebase.firestore();
    return{sub:(n,cb,meta)=>db.collection(n).onSnapshot({includeMetadataChanges:!!meta},q=>cb(q.docs.map(d=>({...d.data(),id:d.id})),q.metadata.fromCache),e=>{dbErr=e.code||String(e);$('dbst').textContent='Versión 3 · error: '+dbErr}),
      set:(n,id,d)=>db.collection(n).doc(id).set(d),add:(n,d)=>db.collection(n).add(d),
      upd:(n,id,d)=>db.collection(n).doc(id).update(d),del:(n,id)=>db.collection(n).doc(id).delete()}}
  const cbs={},get=n=>JSON.parse(localStorage.getItem('albero_'+n)||'[]');
  const put=(n,a)=>{localStorage.setItem('albero_'+n,JSON.stringify(a));if(cbs[n])cbs[n](a.slice(),false)};
  return{sub:(n,cb)=>{cbs[n]=cb;cb(get(n),false)},
    async set(n,id,d){put(n,get(n).filter(x=>x.id!==id).concat([{...d,id}]))},
    async add(n,d){put(n,get(n).concat([{...d,id:'x'+Date.now()+Math.random().toString(36).slice(2,6)}]))},
    async upd(n,id,d){put(n,get(n).map(x=>x.id===id?{...x,...d}:x))},
    async del(n,id){put(n,get(n).filter(x=>x.id!==id))}};
})();

async function cambiarPass(){
  const a=$('m-act').value,n=$('m-new').value,r=$('m-rep').value;
  if(a!==me.pass){await dlg({title:'Contraseña incorrecta',msg:'La contraseña actual no coincide.'});return}
  if(n.length<3){await dlg({title:'Contraseña muy corta',msg:'Usa al menos 3 caracteres.'});return}
  if(n!==r){await dlg({title:'No coinciden',msg:'Las dos contraseñas nuevas deben ser iguales.'});return}
  gs.upd('usuarios',me.id,{pass:n}).catch(e=>dlg({title:'No se pudo guardar',msg:String(e.code||e)}));

function editUser(id){
  if(id==='admin'&&me.id!=='admin'){dlg({title:'No permitido',msg:'Solo el usuario admin puede editar al administrador.'});return}
  editId=id||null;const u=id?users.find(x=>x.id===id):{permisos:{}};
  $('u-nombre').value=u.nombre||'';$('u-user').value=u.usuario||'';$('u-user').disabled=!!id;$('u-pass').value=u.pass||'';
  $('u-activo').checked=id?u.activo!==false:true;$('u-activo').disabled=id==='admin';
  $('u-admin').checked=!!u.admin;$('u-admin').disabled=id==='admin';$('u-adminrow').classList.toggle('hide',!me.admin);
  $('u-perms').innerHTML=PERMS.map(([k,t])=>`<label class="ck"><input type="checkbox" data-p="${k}" ${(u.permisos||{})[k]?'checked':''}> ${t}</label>`).join('');

async function guardarUser(){
  const usuario=$('u-user').value.trim().toLowerCase(),pass=$('u-pass').value;
  if(!/^[a-z0-9._-]{2,}$/.test(usuario)||!pass){await dlg({title:'Faltan datos',msg:'El usuario (letras y números, sin espacios) y la contraseña son obligatorios.'});return}
  const id=editId||usuario;
  if(!editId&&users.some(x=>x.id===id)){await dlg({title:'Ya existe',msg:'Ese usuario ya está creado.'});return}
  const permisos={};document.querySelectorAll('#u-perms input').forEach(i=>permisos[i.dataset.p]=i.checked);
  const old=(editId&&users.find(x=>x.id===editId))||{};
  gs.set('usuarios',id,{usuario:old.usuario||usuario,nombre:$('u-nombre').value.trim()||usuario,pass,
    admin:id==='admin'?true:(me.admin?$('u-admin').checked:!!old.admin),activo:id==='admin'?true:$('u-activo').checked,permisos});
  $('usermodal').classList.add('hide');
}
async function borrarUser(){
  if(!await dlg({title:'Eliminar usuario',msg:'Se eliminará este usuario. ¿Seguro?',ok:'Eliminar',cancel:'Cancelar'}))return;
  gs.del('usuarios',editId);$('usermodal').classList.add('hide');
}

function mover(id,d){
  const i=preguntas.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=preguntas.length)return;
  const a=preguntas[i],b=preguntas[j],oa=a.orden||0,ob=b.orden||0;
  gs.upd('preguntas',a.id,{orden:ob===oa?ob+d:ob});gs.upd('preguntas',b.id,{orden:oa});
}
function editPreg(id){

async function guardarPreg(){
  const texto=$('q-texto').value.trim(),tipo=$('q-tipo').value,opciones=$('q-opc').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!texto){await dlg({title:'Falta el texto',msg:'Escribe la pregunta.'});return}

/* Rellenar encuesta */
function campo(p){
  const id='q-'+p.id,o=(p.opciones||[]);
  if(p.tipo==='texto')return`<input id="${id}">`;
  if(p.tipo==='numero')return`<input id="${id}" type="number" inputmode="decimal">`;
  if(p.tipo==='correo')return`<input id="${id}" type="email" placeholder="nombre@iesalbero.es" autocapitalize="off">`;
  if(p.tipo==='test')return o.map(x=>`<label class="ck"><input type="radio" name="${id}" value="${esc(x)}"> ${esc(x)}</label>`).join('');
  if(p.tipo==='multiple')return o.map(x=>`<label class="ck"><input type="checkbox" data-q="${id}" value="${esc(x)}"> ${esc(x)}</label>`).join('');
  return`<div class="row"><select id="${id}-e" onchange="cursoChg('${id}')"><option value="ESO">ESO</option><option value="Bachillerato">Bachillerato</option></select><select id="${id}-n"></select><select id="${id}-l"></select></div>`;
}
function cursoChg(id){
  const b=$(id+'-e').value==='Bachillerato';
  $(id+'-n').innerHTML=(b?['1º','2º']:['1º','2º','3º','4º']).map(x=>`<option>${x}</option>`).join('');
  $(id+'-l').innerHTML=(b?cfg.bach:cfg.eso).split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<option>${x}</option>`).join('');
}
function pintarForm(){
  let h=`<div class="card"><h2>${esc(cfg.enc_titulo||'Encuesta')}</h2>`;
  if(!preguntas.length)h+='<p style="color:#7b6a55">Todavía no hay preguntas en la encuesta.</p>';
  preguntas.forEach((p,i)=>h+=`<label>${i+1}. ${esc(p.texto)}${p.obligatoria?' *':''}</label>`+campo(p));
  if(preguntas.length)h+='<button class="b" id="e-send" style="width:100%;margin-top:16px" onclick="enviarEnc()">Enviar respuestas</button>';
  $('e-fill-body').innerHTML=h+'</div>';
  preguntas.filter(p=>p.tipo==='curso').forEach(p=>cursoChg('q-'+p.id));
}
function leer(p){
  const id='q-'+p.id;
  if(p.tipo==='test'){const r=document.querySelector(`input[name="${id}"]:checked`);return r?r.value:''}
  if(p.tipo==='multiple')return[...document.querySelectorAll(`input[data-q="${id}"]:checked`)].map(i=>i.value);
  if(p.tipo==='curso')return`${$(id+'-n').value} ${$(id+'-e').value} ${$(id+'-l').value}`;
  return $(id).value.trim();
}
async function enviarEnc(){
  const datos={},preg={};
  for(const p of preguntas){
    const v=leer(p),vacio=v===''||(Array.isArray(v)&&!v.length);
    if(vacio){if(p.obligatoria){await dlg({title:'Falta una respuesta',msg:'Responde: '+p.texto});return}continue}
    if(p.tipo==='correo'&&!/^[^\s@]+@iesalbero\.es$/i.test(v)){await dlg({title:'Correo no válido',msg:'El correo debe terminar en @iesalbero.es'});return}
    datos[p.id]=v;preg[p.id]=p.texto;
  }
  if(!Object.keys(datos).length){await dlg({title:'Sin respuestas',msg:'Responde al menos una pregunta.'});return}
  $('e-send').disabled=true;
  gs.add('respuestas',{creado:Date.now(),fecha:new Date().toLocaleString('es-ES'),usuario:me.usuario,nombre:me.nombre||me.usuario,datos,preg}).catch(console.error);
  await dlg({title:'¡Enviado!',msg:cfg.enc_gracias||'Gracias por responder.'});
  pintarForm();
}

/* Respuestas */
const fv=v=>Array.isArray(v)?v.join(', '):v;
const qtxt=(r,k)=>(r.preg||{})[k]||(preguntas.find(p=>p.id===k)||{}).texto||'(pregunta eliminada)';
function pintarResp(){
  if(!can('ver_respuestas')){$('e-resp-body').innerHTML='<div class="card">No tienes permiso para ver las respuestas.</div>';return}
  $('e-resp-body').innerHTML=`<div class="card"><div class="fl"><h2 style="margin:0">Respuestas (${respuestas.length})</h2><button class="b" onclick="csv()">Descargar CSV</button></div></div>`+respuestas.map(r=>`<div class="card"><small>${esc(r.fecha||'')} · ${esc(r.nombre||r.usuario||'')}</small>`+Object.entries(r.datos||{}).map(([k,v])=>`<p style="margin:8px 0 0"><b>${esc(qtxt(r,k))}</b><br>${esc(fv(v))}</p>`).join('')+'</div>').join('');
}
function csv(){
  const cols={};respuestas.forEach(r=>Object.keys(r.datos||{}).forEach(k=>cols[k]=qtxt(r,k)));
  const ks=Object.keys(cols),q=x=>'"'+String(x==null?'':Array.isArray(x)?x.join('; '):x).replace(/"/g,'""')+'"';
  const rows=[['Fecha','Usuario',...ks.map(k=>cols[k])].map(q).join(';')].concat(respuestas.map(r=>[r.fecha,r.nombre||r.usuario,...ks.map(k=>(r.datos||{})[k])].map(q).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='respuestas-encuesta.csv';a.click();
}

function cargarImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
async function logoPng(){
  const im=(await cargarImg(LOGO_SRC))||(await cargarImg(LOGO_FALLBACK));
  const c=document.createElement('canvas');c.width=im.naturalWidth||400;c.height=im.naturalHeight||400;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return{d:c.toDataURL('image/png'),w:c.width,h:c.height};
}
async function descargar(){
  const l=lists.find(x=>x.id===cur);if(!l)return;
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm',format:'a4'});
  const lg=await logoPng(),lh=16,lw=Math.min(24,lh*lg.w/lg.h),tx=14+lw+5;
  doc.addImage(lg.d,'PNG',14,8,lw,lh);
  doc.setTextColor(62,39,19);
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Listado oficial · '+titulo(l),tx,13.5);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('Taller de Tecnología',tx,18.5);
  doc.text('Departamento de Tecnología del IES Albero',tx,22.5);
  doc.setFontSize(8.5);doc.setTextColor(110,95,75);
  doc.text(`${l.concepto}  ·  Curso ${l.year}  ·  ${l.fecha}`,14,29);
  const n=l.alumnos.length,rh=Math.min(7,(286-32-5-31)/(n+1)),fs=rh>=5.6?9:(rh>=4.8?8:7),pad=Math.max(.5,(rh-fs*.406)/2);
  doc.autoTable({startY:32,margin:{left:14,right:14,bottom:8},head:[['Nº','Alumno','Fabricado','Entregado']],
    body:l.alumnos.map((nm,k)=>{const e=(l.est||{})[k]||{};return[k+1,nm,e.f?'Sí':'',e.e?'Sí':'']}),
    headStyles:{fillColor:[122,82,48]},alternateRowStyles:{fillColor:[250,246,236]},rowPageBreak:'avoid',
    columnStyles:{0:{cellWidth:10},2:{halign:'center',cellWidth:26},3:{halign:'center',cellWidth:26}},
    styles:{fontSize:fs,cellPadding:{top:pad,bottom:pad,left:2,right:2},lineHeightFactor:1.15}});
  let y=doc.lastAutoTable.finalY+5;
  if(y+31>289){doc.addPage();y=15}
  doc.setTextColor(62,39,19);doc.setFontSize(9);
  const dim=u=>new Promise(r=>{const m=new Image();m.onload=()=>r(m);m.onerror=()=>r(null);m.src=u});
  for(const [f,t,x,nm] of [[l.firma1,'Responsable de reparto',20,l.nombre1],[l.firma2,'Profesor',115,l.nombre2]]){
    if(f){const m=await dim(f);if(m){const r=m.width/m.height;let w=70,h=70/r;if(h>18){h=18;w=18*r}doc.addImage(f,'PNG',x,y+18-h,w,h)}}
    doc.setDrawColor(150);doc.line(x,y+19,x+70,y+19);doc.text(t,x,y+24);
    if(nm){doc.setFontSize(8.5);doc.text(nm,x,y+28.5);doc.setFontSize(9)}
  }
  doc.save(`Listado ${titulo(l)} - ${l.concepto}.pdf`.replace(/[\\/:*?"<>|]/g,''));
}
